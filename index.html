<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lucky Roger</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e17;--panel:#1a2333;--panel2:#232e42;--gold:#d4af37;--goldL:#ffd966;--goldD:#8a6d1a;--red:#c0392b;--green:#27ae60;--text:#f0f4f8;--muted:#8899aa}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at top,#1a2744 0%,#0a0e17 70%);background-attachment:fixed;color:var(--text);display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;gap:6px}
.lang-switch{display:flex;gap:4px;background:var(--panel);border:1px solid #2c3a52;border-radius:8px;padding:3px}
.lang-btn{background:transparent;color:var(--muted);border:none;padding:5px 9px;font-size:11px;font-weight:800;border-radius:5px;cursor:pointer}
.lang-btn.active{background:linear-gradient(135deg,var(--gold),var(--goldD));color:#1a1200;box-shadow:0 0 8px rgba(212,175,55,.4)}
.sound-btn{background:var(--panel);border:1px solid #2c3a52;color:var(--gold);padding:8px 12px;border-radius:8px;font-size:16px;cursor:pointer}
.sound-btn.off{color:var(--muted);opacity:.6}
.title-box{text-align:center;padding:4px 0 2px}
.title{font-size:26px;font-weight:900;letter-spacing:3px;color:#ffd966;font-family:Georgia,serif;text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 12px rgba(212,175,55,.5)}
.balance-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #34455f;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.3)}
.stat .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.stat .val{font-size:17px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.stat.right{text-align:right}
.stat.win .val{color:var(--green)}
.machine{background:radial-gradient(ellipse at 50% 0,rgba(255,217,102,.08),transparent 60%),linear-gradient(180deg,#2d1d0f 0%,#1a0e05 100%);border:3px solid;border-image:linear-gradient(180deg,#ffe9a0,#b8860b,#ffe9a0) 1;border-radius:16px;padding:12px 10px 10px;box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.5);position:relative}
.machine::before,.machine::after{content:"✦";position:absolute;font-size:20px;color:var(--gold);opacity:.7;text-shadow:0 0 8px rgba(212,175,55,.6)}
.machine::before{top:4px;left:8px}.machine::after{top:4px;right:8px}
.reels-frame{background:linear-gradient(180deg,#050810,#1a1f2c);border-radius:10px;padding:6px;box-shadow:inset 0 4px 12px rgba(0,0,0,.9),0 0 0 1px #3a4a5c;position:relative;overflow:hidden}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative;z-index:1}
.reel{background:linear-gradient(180deg,#fdf6e3 0%,#f0e6c8 45%,#e0d4b0 100%);border-radius:6px;height:219px;overflow:hidden;position:relative;box-shadow:inset 0 8px 12px -6px rgba(0,0,0,.6),inset 0 -8px 12px -6px rgba(0,0,0,.6),0 0 0 1px #5a4a2a;clip-path:inset(0)}
.reel::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:3;pointer-events:none}
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);z-index:3;pointer-events:none}
.reel-flash{position:absolute;inset:0;background:rgba(255,255,255,0);pointer-events:none;z-index:4;border-radius:6px;transition:background .1s}
.reel-flash.flash{background:rgba(255,217,102,.9)}
.track{position:absolute;left:0;right:0;top:0;transform:translate3d(0,0,0);will-change:transform}
.cell{height:73px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;flex-shrink:0}
.cell.win::before{content:"";position:absolute;inset:4px;border:2px solid #ffd966;border-radius:8px;background:radial-gradient(circle,rgba(255,217,102,.6),rgba(255,217,102,.15) 70%);pointer-events:none;box-shadow:0 0 10px rgba(255,217,102,.8)}
.lines-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.lines-bar{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #34455f;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.3)}
.lines-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.lines-arrow{background:linear-gradient(180deg,#3a4a60,#253247);color:var(--goldL);border:1px solid #455872;border-radius:8px;width:40px;height:36px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #0f1722;display:flex;align-items:center;justify-content:center}
.lines-arrow:active{transform:translateY(2px);box-shadow:none}
.lines-arrow:disabled{opacity:.4;cursor:not-allowed}
.lines-mid{text-align:center}
.lines-mid .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.lines-mid .val{font-size:18px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.lines-mid .val small{font-size:11px;color:var(--muted);font-weight:700}
.lines-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.lp{background:linear-gradient(180deg,#2c3a52,#1a2333);border:1px solid #3a4a60;color:var(--muted);border-radius:6px;padding:5px 0;font-size:11px;font-weight:800;cursor:pointer}
.lp.active{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;border-color:#ffe9a0}
.lp:active{transform:scale(.95)}
.bet-bar{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #34455f;border-radius:12px;padding:10px;display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.3)}
.bet-btn{background:linear-gradient(180deg,#3a4a60,#253247);color:var(--text);border:1px solid #455872;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;min-width:42px;box-shadow:0 2px 0 #0f1722}
.bet-btn:active{transform:translateY(2px);box-shadow:none}
.bet-btn:disabled{opacity:.5;cursor:not-allowed}
.bet-mid{text-align:center}
.bet-mid .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.bet-mid .val{font-size:17px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.bet-total{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-weight:700}
.bet-total b{color:var(--goldL);font-size:13px}
.spin-btn{background:linear-gradient(180deg,#e74c3c 0%,#c0392b 45%,#7a1c11 100%);border:2px solid #ff8a7a;color:#fff;font-size:22px;font-weight:900;letter-spacing:3px;padding:16px;border-radius:14px;cursor:pointer;text-shadow:0 2px 2px rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #4d0e07,0 10px 20px rgba(0,0,0,.5)}
.spin-btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #4d0e07}
.spin-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}
.spin-btn.stop-mode{background:linear-gradient(180deg,#f39c12 0%,#d35400 45%,#8a3400 100%);border-color:#ffb84d;animation:stopPulse 0.7s ease-in-out infinite alternate}
@keyframes stopPulse{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #5a2200,0 10px 20px rgba(0,0,0,.5),0 0 0 rgba(243,156,18,0)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #5a2200,0 10px 20px rgba(0,0,0,.5),0 0 25px rgba(243,156,18,.7)}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act-btn{background:linear-gradient(180deg,#3a4a60,#253247);color:var(--text);border:1px solid #455872;border-radius:10px;padding:10px 4px;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #0f1722,0 4px 8px rgba(0,0,0,.4)}
.act-btn:active{transform:translateY(2px);box-shadow:none}
.act-btn .ico{font-size:20px}
.act-btn.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;border-color:#ffe9a0;box-shadow:0 3px 0 #5a4410}
.act-btn.green{background:linear-gradient(180deg,#2ecc71,#1a7d43);border-color:#58e896;box-shadow:0 3px 0 #0f3d22}
.act-btn.blue{background:linear-gradient(180deg,#3498db,#1a5f8a);border-color:#5dade2;box-shadow:0 3px 0 #0f3d54}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--gold);border-radius:18px;padding:22px 18px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8);text-align:center;max-height:85vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:900;color:var(--goldL);margin-bottom:12px;font-family:Georgia,serif}
.modal-text{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.modal-close{background:linear-gradient(180deg,#576574,#2c3a52);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;margin-top:14px;width:100%}
.pt-table{width:100%;border-collapse:collapse;font-size:12px}
.pt-table thead th{color:var(--goldL);padding:6px 4px;border-bottom:1px solid #455872;font-size:10px;text-transform:uppercase}
.pt-table tbody td{padding:7px 4px;border-bottom:1px solid rgba(69,88,114,.4);font-variant-numeric:tabular-nums}
.pt-sym{font-size:24px;text-align:left;padding-left:8px !important}
.pt-val{color:var(--goldL);font-weight:800}
.shop-grid{display:flex;flex-direction:column;gap:8px}
.shop-card{background:linear-gradient(135deg,#2a3446,#1a2333);border:2px solid #3a4a60;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.shop-card.featured{border-color:var(--gold);background:linear-gradient(135deg,#3a2a1a,#2a1a0a)}
.shop-card:active{transform:scale(.98)}
.shop-left{text-align:left}
.shop-name{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.shop-coins{font-size:20px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.shop-bonus{font-size:11px;color:var(--green);font-weight:800;margin-top:2px}
.shop-price{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;padding:10px 16px;border-radius:10px;font-weight:900;font-size:14px;white-space:nowrap}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.chest{background:linear-gradient(180deg,#4a3520,#2a1a0e);border:2px solid var(--gold);border-radius:12px;font-size:40px;padding:16px 0;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.4)}
.chest:active{transform:scale(.92)}
.chest.opened{background:radial-gradient(circle,#ffd966,#b8860b);border-color:#ffe9a0}
.modal-btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.modal-btn{padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer;color:#fff}
.modal-btn:active{transform:scale(.97)}
.modal-btn.green{background:linear-gradient(180deg,#2ecc71,#1a7d43)}
.modal-btn.red{background:linear-gradient(180deg,#e74c3c,#7a1c11)}
.modal-btn.gray{background:linear-gradient(180deg,#576574,#2c3a52)}
.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2ecc71,#1a7d43);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:top .3s;z-index:999;max-width:90vw;text-align:center;border:2px solid rgba(255,255,255,.3)}
.notif.show{top:20px}
.notif.error{background:linear-gradient(180deg,#e74c3c,#7a1c11)}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}
.start-overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#1a2744,#050810);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.start-overlay.hidden{opacity:0;pointer-events:none}
.start-box{text-align:center;padding:20px;max-width:340px}
.start-emoji{font-size:80px;margin-bottom:10px}
.start-title{font-size:32px;font-weight:900;letter-spacing:3px;color:#ffd966;margin-bottom:8px;font-family:Georgia,serif;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.start-sub{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.5}
.start-btn{width:100%;background:linear-gradient(180deg,#2ecc71,#1a7d43);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 0 #0f3d22;position:relative;z-index:10}
.start-btn.muted{background:linear-gradient(180deg,#576574,#2c3a52);box-shadow:0 4px 0 #1a2333;font-size:13px;padding:11px}
.start-btn:active{transform:translateY(3px);box-shadow:none}
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-emoji">🏴‍☠️</div>
    <div class="start-title">LUCKY ROGER</div>
    <div class="start-sub" data-i18n="startSub">Пиратский слот с сокровищами</div>
    <button class="start-btn" id="startSound">🔊 <span data-i18n="startSound">Играть со звуком</span></button>
    <button class="start-btn muted" id="startMute">🔇 <span data-i18n="startMute">Без звука</span></button>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="uk">UKR</button>
      <button class="lang-btn" data-lang="ru">RUS</button>
      <button class="lang-btn" data-lang="en">ENG</button>
    </div>
    <button class="sound-btn" id="soundBtn">🔊</button>
  </div>
  <div class="title-box"><div class="title">LUCKY ROGER</div></div>
  <div class="balance-bar">
    <div class="stat"><span class="lbl" data-i18n="balance">Баланс</span><span class="val" id="balanceVal">1000 🪙</span></div>
    <div class="stat right win"><span class="lbl" data-i18n="win">Выигрыш</span><span class="val" id="winVal">0 🪙</span></div>
  </div>
  <div class="machine">
    <div class="reels-frame" id="reelsFrame">
      <div class="reels" id="reels"></div>
      <svg class="lines-overlay" id="linesOverlay"></svg>
    </div>
  </div>
  <div class="lines-bar">
    <div class="lines-row">
      <button class="lines-arrow" id="linesDec">−</button>
      <div class="lines-mid">
        <div class="lbl" data-i18n="lines">Линии</div>
        <div class="val"><span id="linesVal">9</span><small> / 21</small></div>
      </div>
      <button class="lines-arrow" id="linesInc">+</button>
    </div>
    <div class="lines-presets">
      <button class="lp" data-lines="1">1</button>
      <button class="lp" data-lines="3">3</button>
      <button class="lp" data-lines="5">5</button>
      <button class="lp" data-lines="9">9</button>
      <button class="lp" data-lines="15">15</button>
      <button class="lp" data-lines="21">21</button>
    </div>
  </div>
  <div class="bet-bar">
    <button class="bet-btn" id="betMin">MIN</button>
    <button class="bet-btn" id="betDec">−</button>
    <div class="bet-mid">
      <div class="lbl" data-i18n="betPerLine">Ставка / линия</div>
      <div class="val" id="betVal">1 🪙</div>
    </div>
    <button class="bet-btn" id="betInc">+</button>
    <button class="bet-btn" id="betMax">MAX</button>
  </div>
  <div class="bet-total"><span data-i18n="totalBet">Всего</span>: <b id="totalBetVal">9</b> 🪙</div>
  <button class="spin-btn" id="spinBtn" data-i18n="spin">КРУТИТЬ</button>
  <div class="actions">
    <button class="act-btn gold" id="bonusBtn"><span class="ico">🎁</span><span data-i18n="dailyBonus">Бонус</span></button>
    <button class="act-btn green" id="riskBtn"><span class="ico">🃏</span><span data-i18n="risk">Риск</span></button>
    <button class="act-btn blue" id="shopBtn"><span class="ico">⭐</span><span data-i18n="shop">Магазин</span></button>
    <button class="act-btn" id="paytableBtn"><span class="ico">📋</span><span data-i18n="paytable">Выплаты</span></button>
  </div>
</div>

<div class="modal" id="paytableModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="paytableTitle">📋 ТАБЛИЦА ВЫПЛАТ</div>
    <div class="modal-text" data-i18n="paytableHint">Выплаты за 1 монету ставки на линию</div>
    <table class="pt-table"><thead><tr><th></th><th>×3</th><th>×4</th><th>×5</th></tr></thead><tbody id="ptBody"></tbody></table>
    <button class="modal-close" onclick="closeModal('paytableModal')" data-i18n="close">Закрыть</button>
  </div>
</div>

<div class="modal" id="shopModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="shopTitle">⭐ МАГАЗИН МОНЕТ</div>
    <div class="modal-text" data-i18n="shopHint">Покупка за Telegram Stars</div>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="modal-close" onclick="closeModal('shopModal')" data-i18n="close">Закрыть</button>
  </div>
</div>

<div class="modal" id="bonusModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="bonusTitle">🏴‍☠️ ПИРАТСКИЙ КЛАД</div>
    <div class="modal-text" data-i18n="bonusText">Выберите сундук:</div>
    <div class="chests">
      <div class="chest" data-chest="0">📦</div>
      <div class="chest" data-chest="1">📦</div>
      <div class="chest" data-chest="2">📦</div>
    </div>
  </div>
</div>

<div class="modal" id="riskModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="riskTitle">🃏 РИСК-ИГРА</div>
    <div class="modal-text" id="riskText"></div>
    <div class="modal-btns">
      <button class="modal-btn green" id="riskHigher"></button>
      <button class="modal-btn red" id="riskLower"></button>
      <button class="modal-btn gray" id="riskTake"></button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const CONFIG = {
  invoiceEndpoint: '/api/invoice',
  packages: [
    { id: 'p100',   stars: 100,   coins: 1000,   name: 'Старт',      bonus: '' },
    { id: 'p500',   stars: 500,   coins: 6000,   name: 'Популярный', bonus: '+20%' },
    { id: 'p2000',  stars: 2000,  coins: 30000,  name: 'Клад',       bonus: '+50%', featured: true },
    { id: 'p10000', stars: 10000, coins: 200000, name: 'Легенда',    bonus: '+100%' }
  ]
};

const REELS=5, ROWS=3, CELL_H=73, MAX_LINES=21;
const AUTO_STOP_TIME = 7000; // 7 секунд

const SYMBOLS=['🏴‍☠️','💎','🦜','🗺️','⚓','🗡️','🪙','💣'];
// Настроил веса чуть щедрее для выигрышей
const WEIGHTS={'🏴‍☠️':3,'💎':5,'🦜':8,'🗺️':10,'⚓':14,'🗡️':16,'🪙':24,'💣':12};

function makeWav(duration, sampler, sampleRate) {
  sampleRate = sampleRate || 44100; 
  const numSamples = Math.floor(sampleRate * duration);
  const bytes = new Uint8Array(44 + numSamples * 2);
  const view = new DataView(bytes.buffer);
  function w(off, str) { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); }
  
  w(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true);
  w(8, 'WAVE'); w(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  w(36, 'data'); view.setUint32(40, numSamples * 2, true);
  
  for (let i = 0; i < numSamples; i++) {
    let s = sampler(i / sampleRate);
    if (s > 1) s = 1; else if (s < -1) s = -1;
    view.setInt16(44 + i * 2, s * 0x7FFF, true);
  }
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return 'data:audio/wav;base64,' + btoa(bin);
}

function createAudio(url, volume=0.7) {
  const a = new Audio();
  a.preload = 'auto';
  a.src = url;
  a.volume = volume;
  try { a.load(); } catch(e) {}
  return a;
}

function warmupAudio() {
  const all = [...Object.values(SFX), ...reelStopPool];
  all.forEach(a => {
    if (!a || !a.play) return;
    const orig = a.volume;
    try {
      a.volume = 0;
      const p = a.play();
      if (p && p.then) {
        p.then(() => { try { a.pause(); a.currentTime = 0; a.volume = orig; } catch(e) {} }).catch(() => { try { a.volume = orig; } catch(e) {} });
      } else { try { a.pause(); a.currentTime = 0; a.volume = orig; } catch(e) {} }
    } catch(e) { try { a.volume = orig; } catch(e) {} }
  });
}

/* ============================================================
   🎰 РЕАЛИСТИЧНАЯ АНИМАЦИЯ (rAF)
   ============================================================ */
let reelAnimFrames = [null, null, null, null, null];
let reelPositions = [0, 0, 0, 0, 0];

function startReelSpin(r) {
  const track = tracks[r];
  // Генерируем очень длинную ленту, чтобы крутилось долго
  let html = '';
  for (let i = 0; i < 40; i++) html += `<div class="cell">${randSym()}</div>`;
  track.innerHTML = html;
  
  let lastTime = performance.now();
  const speed = 2000; // пикселей в секунду
  
  function frame(now) {
    if (!isSpinning) return; // Если остановили, выходим из цикла
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    
    reelPositions[r] -= speed * dt;
    
    // Зацикливаем: если уехали на 20 клеток вниз, возвращаем наверх
    if (reelPositions[r] <= -(20 * CELL_H)) {
      reelPositions[r] += 20 * CELL_H;
    }
    
    track.style.transform = `translate3d(0, ${reelPositions[r]}px, 0)`;
    reelAnimFrames[r] = requestAnimationFrame(frame);
  }
  reelAnimFrames[r] = requestAnimationFrame(frame);
}

function stopReelAnim(r, final3) {
  return new Promise(resolve => {
    setTimeout(() => {
      cancelAnimationFrame(reelAnimFrames[r]); // Останавливаем цикл
      
      const track = tracks[r];
      const currentY = reelPositions[r];
      
      // Теперь формируем правильную ленту, которая будет тормозить
      let html = '';
      // Добавляем рандомные символы сверху, чтобы не было пустоты
      for (let i = 0; i < 15; i++) html += `<div class="cell">${randSym()}</div>`;
      // Добавляем выигрышные символы
      final3.forEach(s => html += `<div class="cell">${s}</div>`);
      // И еще немного снизу
      for (let i = 0; i < 5; i++) html += `<div class="cell">${randSym()}</div>`;
      track.innerHTML = html;
      
      // Ставим трек в текущую позицию, где он был (модуль 15 клеток)
      let startY = currentY % (15 * CELL_H);
      if(startY > 0) startY -= 15 * CELL_H;
      
      track.style.transition = 'none';
      track.style.transform = `translate3d(0, ${startY}px, 0)`;
      track.getBoundingClientRect(); // рефлоу
      
      // Едем вниз до финальных символов (они на позиции -15 клеток)
      // Сделаем несколько оборотов для красоты
      let targetY = -15 * CELL_H;
      
      // Длительность торможения (с задержкой по очереди для барабанов)
      const dur = 800 + r * 200; 
      
      track.style.transition = `transform ${dur}ms cubic-bezier(0.1, 0.8, 0.2, 1)`;
      track.style.transform = `translate3d(0, ${targetY}px, 0)`;
      
      setTimeout(() => {
        track.style.transition = 'none';
        track.style.transform = 'translate3d(0,0,0)';
        track.innerHTML = final3.map(s => `<div class="cell">${s}</div>`).join('');
        try {
          flashes[r].classList.add('flash');
          setTimeout(()=>flashes[r].classList.remove('flash'), 100);
        } catch(e) {}
        
        sfx('reelStop');
        haptic('light');
        resolve();
      }, dur + 50);
    }, r * 200); // Задержка старта остановки
  });
}

    g.push(col);
  }
  return g;
}

function calcWins(grid,perLine){
  const cells=new Set(), wins=[]; let total=0;
  const winSounds = [];

  PAYLINES.slice(0, state.lines).forEach((line,idx)=>{
    const syms=line.map(([r,row])=>grid[r][row]);
    const first=syms[0];
    let count=1;
    for(let i=1;i<REELS;i++){ if(syms[i]===first) count++; else break; }
    if(count>=3){
      const mult=PAYTABLE[first][count-3];
      if(mult>0){
        const win=mult*perLine;
        total+=win;
        wins.push({idx,line,sym:first,count,mult,win});
        for(let i=0;i<count;i++) cells.add(`${line[i][0]},${line[i][1]}`);
        // Добавляем звук этой линии
        if (WIN_SOUND[first]) winSounds.push(WIN_SOUND[first]);
      }
    }
  });
  return {total, cells, wins, winSounds};
}

/* ============================================================
   LINES PREVIEW
   ============================================================ */
let previewTimeout=null, previewFadeTimeout=null;

function clearLines(){
  overlay.innerHTML='';
  overlay.style.transition='none';
  overlay.style.opacity='1';
  if(previewTimeout){clearTimeout(previewTimeout);previewTimeout=null}
  if(previewFadeTimeout){clearTimeout(previewFadeTimeout);previewFadeTimeout=null}
}

function drawWinLines(wins){
  overlay.innerHTML='';
  const fRect=frame.getBoundingClientRect();
  overlay.setAttribute('width',fRect.width);
  overlay.setAttribute('height',fRect.height);
  wins.forEach(w=>{
    const pts=[];
    for(let i=0;i<w.count;i++){
      const [r,row]=w.line[i];
      const cell=tracks[r].children[row];
      if(!cell) continue;
      const cr=cell.getBoundingClientRect();
      pts.push([cr.left+cr.width/2-fRect.left, cr.top+cr.height/2-fRect.top]);
    }
    if(pts.length<2) return;
    const color=LINE_COLORS[w.idx%LINE_COLORS.length];
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
    poly.setAttribute('stroke',color);
    poly.setAttribute('stroke-width','5');
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke-linecap','round');
    poly.setAttribute('stroke-linejoin','round');
    overlay.appendChild(poly);
    try{
      const len=poly.getTotalLength();
      poly.style.strokeDasharray=len;
      poly.style.strokeDashoffset=len;
      poly.style.transition='stroke-dashoffset 0.45s ease-out';
      poly.getBoundingClientRect();
      requestAnimationFrame(()=>{poly.style.strokeDashoffset=0});
    }catch(e){}
  });
}

function previewActiveLines(){
  clearLines();
  if (state.lines === 0) return;
  const fRect = frame.getBoundingClientRect();
  overlay.setAttribute('width', fRect.width);
  overlay.setAttribute('height', fRect.height);
  overlay.style.opacity = '1';

  const lines = PAYLINES.slice(0, state.lines);

  lines.forEach((line, idx) => {
    const pts = [];
    for (const [r, row] of line) {
      const cell = tracks[r].children[row];
      if (!cell) continue;
      const cr = cell.getBoundingClientRect();
      pts.push([cr.left + cr.width/2 - fRect.left, cr.top + cr.height/2 - fRect.top]);
    }
    if (pts.length < 2) return;
    const color = LINE_COLORS[idx % LINE_COLORS.length];
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    poly.setAttribute('stroke', color);
    poly.setAttribute('stroke-width', '3.5');
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke-linecap', 'round');
    poly.setAttribute('stroke-linejoin', 'round');
    overlay.appendChild(poly);
    try {
      const len = poly.getTotalLength();
      poly.style.strokeDasharray = len;
      poly.style.strokeDashoffset = len;
      poly.style.transition = 'stroke-dashoffset 1s ease-out';
      poly.getBoundingClientRect();
      requestAnimationFrame(() => { poly.style.strokeDashoffset = 0; });
    } catch(e) {}
  });

  previewTimeout = setTimeout(() => {
    overlay.style.transition = 'opacity 0.5s';
    overlay.style.opacity = '0';
    previewFadeTimeout = setTimeout(() => {
      overlay.innerHTML = '';
      overlay.style.opacity = '1';
      overlay.style.transition = 'none';
    }, 500);
  }, 1600);
}

/* ============================================================
   UI
   ============================================================ */
function refresh(){
  $('balanceVal').textContent=fmt(state.balance)+' 🪙';
  $('betVal').textContent=fmt(state.betPerLine)+' 🪙';
  $('totalBetVal').textContent=fmt(totalBet());
  $('linesVal').textContent=state.lines;
  const sb = $('spinBtn');
  if (isSpinning) {
    sb.textContent = t('spinStop');
    sb.classList.add('stop-mode');
    sb.disabled = false;
  } else {
    sb.textContent = t('spin');
    sb.classList.remove('stop-mode');
    sb.disabled = false;
  }
  $('betMin').disabled=isSpinning||state.betPerLine<=1;
  $('betDec').disabled=isSpinning||state.betPerLine<=1;
  $('betInc').disabled=isSpinning||state.betPerLine>=1000;
  $('betMax').disabled=isSpinning||state.betPerLine>=1000;
  $('linesDec').disabled=isSpinning||state.lines<=1;
  $('linesInc').disabled=isSpinning||state.lines>=MAX_LINES;
  $('soundBtn').textContent=state.sound?'🔊':'🔇';
  $('soundBtn').classList.toggle('off',!state.sound);
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));
  document.querySelectorAll('.lp').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.lines)===state.lines));
  document.documentElement.lang=state.lang;
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $('riskHigher').textContent=t('riskHigher');
  $('riskLower').textContent=t('riskLower');
  $('riskTake').textContent=t('riskTake');
  refresh();
}
function notif(msg,type=''){
  const n=$('notif');
  n.textContent=msg;
  n.className='notif show '+type;
  clearTimeout(n._t);
  n._t=setTimeout(()=>{n.className='notif '+type},2400);
}
function closeModal(id){ $(id).classList.remove('active'); }
window.closeModal=closeModal;

/* ============================================================
   SPIN / STOP
   ============================================================ */
async function handleSpinClick() {
  if (isSpinning) {
    requestStop();
  } else {
    await startSpinAction();
  }
}

async function startSpinAction() {
  const bet = totalBet();
  if (state.balance < bet) { notif(t('notEnough'),'error'); sfx('lose'); haptic('error'); return; }
  
  isSpinning = true;
  stopRequested = false;
  clearLines();
  document.querySelectorAll('.cell.win').forEach(c=>c.classList.remove('win'));
  state.balance -= bet;
  $('winVal').textContent = '0 🪙';
  save(); refresh();
  
  sfx('spinStart');
  setTimeout(()=>{ if (isSpinning) startReelLoop(); }, 150);
  haptic('medium');
  
  // Сбрасываем позиции перед стартом
  reelPositions = [0, 0, 0, 0, 0];
  tracks.forEach((tr, i) => startReelSpin(i));
  
  // Автостоп через 7 секунд
  autoStopTimer = setTimeout(() => requestStop(), AUTO_STOP_TIME);
}

async function requestStop() {
  if (!isSpinning || stopRequested) return;
  stopRequested = true;
  if (autoStopTimer) { clearTimeout(autoStopTimer); autoStopTimer = null; }
  
  stopReelLoop();
  
  const bet = totalBet();
  const perLine = state.betPerLine;
  const finalGrid = genGrid();
  
  // Останавливаем по очереди
  await Promise.all(tracks.map((tr, i) => stopReelAnim(i, finalGrid[i])));
  
  const {total,cells,wins,winSounds} = calcWins(finalGrid, perLine);
  
  if (total > 0) {
    state.balance += total;
    $('winVal').textContent = '+' + fmt(total) + ' 🪙';
    
    // Подсвечиваем клетки
    cells.forEach(key=>{
      const [r,row]=key.split(',').map(Number);
      const c=tracks[r].children[row];
      if(c) c.classList.add('win');
    });
    setTimeout(()=>drawWinLines(wins), 150);
    
    // 🎵 Проигрываем звуки выигравших линий по очереди
    let delay = 200;
    winSounds.forEach(snd => {
      setTimeout(() => { sfx(snd); haptic('success'); }, delay);
      delay += 300; // Задержка между звуками линий
    });

    const ratio = total / bet;
    haptic(ratio >= 10 ? 'heavy' : 'success');
    notif(ratio >= 10 ? tF('bigWin',{n:fmt(total)}) : tF('winMsg',{n:fmt(total)}), ratio >= 10 ? 'gold' : '');
    if (total >= bet * 2) pendingRisk = total;
  } else {
    sfx('lose');
    haptic('error');
  }
  
  if (Math.random() < 0.03) setTimeout(triggerBonus, 500);
  
  isSpinning = false;
  save(); refresh();
}

/* ============================================================
   PAYTABLE / SHOP
   ============================================================ */
function buildPaytable(){
  const tbody=$('ptBody');
  tbody.innerHTML='';
  SYMBOLS.forEach(sym=>{
    const [p3,p4,p5]=PAYTABLE[sym];
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="pt-sym">${sym}</td><td class="pt-val">${p3}</td><td class="pt-val">${p4}</td><td class="pt-val">${p5}</td>`;
    tbody.appendChild(tr);
  });
}
function openPaytable(){ buildPaytable(); $('paytableModal').classList.add('active'); }
function buildShop(){
  const grid=$('shopGrid');
  grid.innerHTML='';
  CONFIG.packages.forEach(pkg=>{
    const card=document.createElement('div');
    card.className='shop-card'+(pkg.featured?' featured':'');
    card.innerHTML=`
      <div class="shop-left">
        <div class="shop-name">${pkg.name}</div>
        <div class="shop-coins">${fmt(pkg.coins)} 🪙</div>
        ${pkg.bonus?`<div class="shop-bonus">${pkg.bonus}</div>`:''}
      </div>
      <div class="shop-price">${pkg.stars} ⭐</div>`;
    card.onclick=()=>buyPackage(pkg);
    grid.appendChild(card);
  });
}
function openShop(){ buildShop(); $('shopModal').classList.add('active'); }

async function buyPackage(pkg){
  const tg=window.Telegram?.WebApp;
  try{
    const res=await fetch(CONFIG.invoiceEndpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ packageId: pkg.id, initData: tg?.initData || '' })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const { invoiceLink, error } = await res.json();
    if(error) throw new Error(error);
    if(!invoiceLink) throw new Error('no invoiceLink');

    if(tg?.openInvoice){
      tg.openInvoice(invoiceLink,(status)=>{
        if(status==='paid'){
          fetch('/api/balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: tg.initData })
          }).then(r => r.json()).then(d => {
             if (d.balance !== undefined) state.balance = d.balance;
             save(); refresh(); sfx('coin'); haptic('success');
             notif('Оплата получена!', 'gold');
             closeModal('shopModal');
          });
        }
      });
    }else{
      window.open(invoiceLink,'_blank');
    }
  }catch(e){
    console.error(e);
    notif('Ошибка магазина', 'error');
  }
}

/* ============================================================
   BONUS / RISK / DAILY
   ============================================================ */
function triggerBonus(){
  sfx('bonus'); haptic('success');
  document.querySelectorAll('.chest').forEach(c=>{
    c.textContent='📦'; c.classList.remove('opened');
    c.onclick=()=>pickChest(c);
  });
  $('bonusModal').classList.add('active');
}
function pickChest(el){
  if(el.classList.contains('opened')) return;
  sfx('chest'); haptic('medium');
  const prizes=[50,100,200,300,500,1000];
  const prize=prizes[Math.floor(Math.random()*prizes.length)];
  el.textContent='💎'; el.classList.add('opened');
  state.balance+=prize; save(); refresh();
  notif(tF('bonusWon',{n:fmt(prize)}),'gold');
  document.querySelectorAll('.chest').forEach(c=>{
    if(c!==el && !c.classList.contains('opened')){ c.textContent='🕳️'; c.classList.add('opened'); }
  });
  setTimeout(()=>$('bonusModal').classList.remove('active'),1500);
}
function openRisk(){
  if(pendingRisk<=0){ notif(t('riskNoWin'),'error'); return; }
  $('riskText').textContent=tF('riskText',{n:fmt(pendingRisk)});
  $('riskModal').classList.add('active');
}
function riskChoose(win){
  const won=Math.random()<0.5 ? win : !win;
  $('riskModal').classList.remove('active');
  if(won){
    state.balance+=pendingRisk;
    sfx('riskWin'); haptic('success');
    notif(tF('riskWin',{n:fmt(pendingRisk)}),'gold');
  }else{
    state.balance-=pendingRisk;
    sfx('riskLose'); haptic('error');
    notif(t('riskLose'),'error');
  }
  pendingRisk=0; save(); refresh();
}
function claimDaily(){
  const now=Date.now();
  if(now-state.lastDaily<24*3600*1000){ notif(t('dailyClaimed'),'error'); return; }
  state.lastDaily=now; state.balance+=100;
  save(); refresh(); sfx('bonus'); haptic('success');
  notif(t('dailyGot'),'gold');
}
function changeLines(newCount){
  if (isSpinning) return;
  newCount = Math.max(1, Math.min(MAX_LINES, newCount));
  if (newCount === state.lines) { previewActiveLines(); return; }
  state.lines = newCount;
  save(); refresh();
  sfx('click'); haptic('select');
  previewActiveLines();
}

/* ============================================================
   EVENTS
   ============================================================ */
function bind(){
  $('startSound').addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    state.sound=true; save();
    buildAudio();
    warmupAudio();
    setTimeout(()=>{ try{ playSfx('winPirate'); }catch(e){} }, 30);
    haptic('success');
    setTimeout(()=>{ $('startOverlay').classList.add('hidden'); refresh(); }, 200);
  });
  $('startMute').addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    state.sound=false; save();
    buildAudio();
    $('startOverlay').classList.add('hidden');
    refresh();
  });

  $('linesDec').onclick=()=>changeLines(state.lines-1);
  $('linesInc').onclick=()=>changeLines(state.lines+1);
  document.querySelectorAll('.lp').forEach(b=>{
    b.onclick=()=>changeLines(parseInt(b.dataset.lines));
  });

  $('betMin').onclick=()=>{ if(!isSpinning){state.betPerLine=1; sfx('click'); haptic('light'); save(); refresh()} };
  $('betMax').onclick=()=>{ if(!isSpinning){state.betPerLine=1000; sfx('click'); haptic('light'); save(); refresh()} };
  $('betDec').onclick=()=>{ if(!isSpinning){state.betPerLine=Math.max(1,state.betPerLine-1); sfx('click'); haptic('light'); save(); refresh()} };
  $('betInc').onclick=()=>{ if(!isSpinning){state.betPerLine=Math.min(1000,state.betPerLine+1); sfx('click'); haptic('light'); save(); refresh()} };

  $('spinBtn').onclick=()=>{ handleSpinClick(); };

  $('bonusBtn').onclick=()=>{ sfx('click'); haptic('light'); claimDaily(); };
  $('riskBtn').onclick=()=>{ sfx('click'); haptic('light'); openRisk(); };
  $('shopBtn').onclick=()=>{ sfx('click'); haptic('light'); openShop(); };
  $('paytableBtn').onclick=()=>{ sfx('click'); haptic('light'); openPaytable(); };

  $('soundBtn').onclick=()=>{
    state.sound=!state.sound;
    if(state.sound){
      buildAudio();
      warmupAudio();
      sfx('click'); haptic('light'); notif(t('soundOn'));
    } else {
      stopReelLoop();
      notif(t('soundOff'),'error');
    }
    save(); refresh();
  };

  $('riskHigher').onclick=()=>riskChoose(true);
  $('riskLower').onclick=()=>riskChoose(false);
  $('riskTake').onclick=()=>{ $('riskModal').classList.remove('active'); pendingRisk=0; };

  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.onclick=()=>{ state.lang=b.dataset.lang; save(); applyI18n(); sfx('click'); haptic('light'); notif(t('langChanged')); };
  });

  document.querySelectorAll('.modal').forEach(m=>{
    m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('active'); });
  });

  window.addEventListener('resize',()=>{ if(overlay.innerHTML && !isSpinning) clearLines(); });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) stopReelLoop();
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  load();
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    tg.setHeaderColor?.('#0a0e17'); tg.setBackgroundColor?.('#0a0e17');
    const code = tg.initDataUnsafe?.user?.language_code;
    if (code) state.lang = code.startsWith('uk') ? 'uk' : code.startsWith('ru') ? 'ru' : 'en';
    
    // Скачиваем реальный баланс с сервера
    try {
      const res = await fetch('/api/balance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData })
      });
      const data = await res.json();
      if (data.balance !== undefined) {
        state.balance = data.balance;
        save();
      }
    } catch(e) { console.error('Balance sync error:', e); }
  }
  buildReels(); bind(); applyI18n();
  setTimeout(() => { try { buildAudio(); } catch(e){} }, 100);
}
init();
</script>
