<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lucky Roger</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e17;--panel:#1a2333;--panel2:#232e42;--gold:#d4af37;--goldL:#ffd966;--goldD:#8a6d1a;--red:#c0392b;--redD:#7a1c11;--green:#27ae60;--text:#f0f4f8;--muted:#8899aa}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at top,#1a2744 0%,#0a0e17 70%);background-attachment:fixed;color:var(--text);display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px}

/* TOPBAR */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;gap:6px}
.lang-switch{display:flex;gap:4px;background:var(--panel);border:1px solid #2c3a52;border-radius:8px;padding:3px}
.lang-btn{background:transparent;color:var(--muted);border:none;padding:5px 9px;font-size:11px;font-weight:800;border-radius:5px;cursor:pointer;transition:all .15s}
.lang-btn.active{background:linear-gradient(135deg,var(--gold),var(--goldD));color:#1a1200;box-shadow:0 0 8px rgba(212,175,55,.4)}
.sound-btn{background:var(--panel);border:1px solid #2c3a52;color:var(--gold);padding:8px 12px;border-radius:8px;font-size:16px;cursor:pointer;transition:all .15s}
.sound-btn.off{color:var(--muted);opacity:.6}

/* TITLE */
.title-box{text-align:center;padding:4px 0 2px}
.title{font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,#ffe9a0 0%,#f0c040 35%,#b8860b 60%,#ffd966 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(212,175,55,.35));font-family:Georgia,serif;animation:shine 4s linear infinite;background-size:200% 100%}
@keyframes shine{0%{background-position:0 0}100%{background-position:200% 0}}

/* BALANCE */
.balance-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #34455f;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.3)}
.stat .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.stat .val{font-size:17px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.stat.right{text-align:right}
.stat.win .val{color:var(--green);text-shadow:0 0 10px rgba(39,174,96,.4)}

/* MACHINE */
.machine{background:radial-gradient(ellipse at 50% 0,rgba(255,217,102,.08),transparent 60%),linear-gradient(180deg,#2d1d0f 0%,#1a0e05 100%);border:3px solid;border-image:linear-gradient(180deg,#ffe9a0,#b8860b,#ffe9a0) 1;border-radius:16px;padding:12px 10px 10px;box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.5);position:relative}
.machine::before,.machine::after{content:"✦";position:absolute;font-size:20px;color:var(--gold);opacity:.7;text-shadow:0 0 8px rgba(212,175,55,.6)}
.machine::before{top:4px;left:8px}.machine::after{top:4px;right:8px}
.reels-frame{background:linear-gradient(180deg,#050810,#1a1f2c);border-radius:10px;padding:6px;box-shadow:inset 0 4px 12px rgba(0,0,0,.9),0 0 0 1px #3a4a5c;position:relative}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative;z-index:1}
.reel{background:linear-gradient(180deg,#fdf6e3 0%,#f0e6c8 45%,#e0d4b0 100%);border-radius:6px;height:219px;overflow:hidden;position:relative;box-shadow:inset 0 8px 12px -6px rgba(0,0,0,.6),inset 0 -8px 12px -6px rgba(0,0,0,.6),0 0 0 1px #5a4a2a}
.reel::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent);z-index:3;pointer-events:none}
.reel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent);z-index:3;pointer-events:none}
.track{position:absolute;left:0;right:0;top:0;will-change:transform,filter}
.track.spinning{filter:blur(1.5px)}
.cell{height:73px;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cell.win::before{content:"";position:absolute;inset:4px;border:2px solid var(--goldL);border-radius:8px;background:radial-gradient(circle,rgba(255,217,102,.5),transparent 70%);box-shadow:0 0 14px var(--goldL),inset 0 0 14px rgba(255,217,102,.5);pointer-events:none;animation:winPulse .7s ease-in-out infinite alternate}
@keyframes winPulse{0%{transform:scale(.95);opacity:.85}100%{transform:scale(1.03);opacity:1}}
.lines-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.lines-overlay polyline{transition:stroke-dashoffset .45s ease-out}

/* LINES SELECTOR */
.lines-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.line-btn{padding:7px 0;background:linear-gradient(180deg,#3a4a60,#253247);border:1px solid #455872;color:var(--muted);border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;transition:all .1s;box-shadow:0 2px 0 #0f1722}
.line-btn.active{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;border-color:#ffe9a0;box-shadow:0 2px 0 #5a4410,0 0 10px rgba(212,175,55,.4)}
.line-btn:active{transform:translateY(1px);box-shadow:none}
.line-btn:disabled{opacity:.5}

/* BET */
.bet-bar{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #34455f;border-radius:12px;padding:10px;display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 6px rgba(0,0,0,.3)}
.bet-btn{background:linear-gradient(180deg,#3a4a60,#253247);color:var(--text);border:1px solid #455872;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;transition:all .1s;min-width:42px;box-shadow:0 2px 0 #0f1722,0 3px 6px rgba(0,0,0,.4)}
.bet-btn:active{transform:translateY(2px);box-shadow:0 0 0 #0f1722}
.bet-btn:disabled{opacity:.5;cursor:not-allowed}
.bet-mid{text-align:center}
.bet-mid .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.bet-mid .val{font-size:17px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.bet-total{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}

/* SPIN */
.spin-btn{background:linear-gradient(180deg,#e74c3c 0%,#c0392b 45%,#7a1c11 100%);border:2px solid #ff8a7a;color:#fff;font-size:22px;font-weight:900;letter-spacing:3px;padding:16px;border-radius:14px;cursor:pointer;text-shadow:0 2px 2px rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #4d0e07,0 10px 20px rgba(0,0,0,.5),0 0 30px rgba(231,76,60,.4);transition:all .08s;position:relative;overflow:hidden}
.spin-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:sweep 3s infinite}
@keyframes sweep{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.spin-btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #4d0e07,0 4px 10px rgba(0,0,0,.5)}
.spin-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}

/* ACTIONS */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act-btn{background:linear-gradient(180deg,#3a4a60,#253247);color:var(--text);border:1px solid #455872;border-radius:10px;padding:10px 4px;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #0f1722,0 4px 8px rgba(0,0,0,.4);transition:all .1s}
.act-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f1722}
.act-btn .ico{font-size:20px}
.act-btn.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;border-color:#ffe9a0;box-shadow:0 3px 0 #5a4410}
.act-btn.green{background:linear-gradient(180deg,#2ecc71,#1a7d43);border-color:#58e896;box-shadow:0 3px 0 #0f3d22}
.act-btn.blue{background:linear-gradient(180deg,#3498db,#1a5f8a);border-color:#5dade2;box-shadow:0 3px 0 #0f3d54}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
.modal.active{opacity:1;pointer-events:auto}
.modal-box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--gold);border-radius:18px;padding:22px 18px;max-width:400px;width:100%;box-shadow:0 0 40px rgba(212,175,55,.5),0 20px 60px rgba(0,0,0,.8);text-align:center;transform:scale(.9);transition:transform .25s;max-height:85vh;overflow-y:auto}
.modal.active .modal-box{transform:scale(1)}
.modal-title{font-size:20px;font-weight:900;color:var(--goldL);margin-bottom:12px;text-shadow:0 0 15px rgba(212,175,55,.5);font-family:Georgia,serif}
.modal-text{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.modal-close{background:linear-gradient(180deg,#576574,#2c3a52);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;margin-top:14px;width:100%}

/* PAYTABLE */
.pt-table{width:100%;border-collapse:collapse;font-size:12px}
.pt-table thead th{color:var(--goldL);padding:6px 4px;border-bottom:1px solid #455872;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.pt-table tbody td{padding:7px 4px;border-bottom:1px solid rgba(69,88,114,.4);font-variant-numeric:tabular-nums}
.pt-table tbody tr:last-child td{border-bottom:none}
.pt-sym{font-size:24px;text-align:left;padding-left:8px !important}
.pt-val{color:var(--goldL);font-weight:800}
.pt-val.hi{color:var(--goldL);text-shadow:0 0 8px rgba(255,217,102,.4)}

/* SHOP */
.shop-grid{display:flex;flex-direction:column;gap:8px}
.shop-card{background:linear-gradient(135deg,#2a3446,#1a2333);border:2px solid #3a4a60;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.shop-card:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 6px 15px rgba(0,0,0,.4)}
.shop-card.featured{border-color:var(--gold);background:linear-gradient(135deg,#3a2a1a,#2a1a0a);box-shadow:0 0 20px rgba(212,175,55,.3)}
.shop-card:active{transform:scale(.98)}
.shop-left{text-align:left}
.shop-name{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.shop-coins{font-size:20px;font-weight:900;color:var(--goldL);font-variant-numeric:tabular-nums}
.shop-bonus{font-size:11px;color:var(--green);font-weight:800;margin-top:2px}
.shop-price{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200;padding:10px 16px;border-radius:10px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* CHESTS */
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.chest{background:linear-gradient(180deg,#4a3520,#2a1a0e);border:2px solid var(--gold);border-radius:12px;font-size:40px;padding:16px 0;cursor:pointer;transition:transform .15s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.4)}
.chest:active{transform:scale(.92)}
.chest.opened{background:radial-gradient(circle,#ffd966,#b8860b);border-color:#ffe9a0}

/* RISK */
.modal-btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.modal-btn{padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer;color:#fff;transition:transform .1s}
.modal-btn:active{transform:scale(.97)}
.modal-btn.green{background:linear-gradient(180deg,#2ecc71,#1a7d43)}
.modal-btn.red{background:linear-gradient(180deg,#e74c3c,#7a1c11)}
.modal-btn.gray{background:linear-gradient(180deg,#576574,#2c3a52)}

/* NOTIF */
.notif{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2ecc71,#1a7d43);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:top .35s cubic-bezier(.3,1.5,.5,1);z-index:999;max-width:90vw;text-align:center;border:2px solid rgba(255,255,255,.3)}
.notif.show{top:20px}
.notif.error{background:linear-gradient(180deg,#e74c3c,#7a1c11)}
.notif.gold{background:linear-gradient(180deg,#ffd966,#b8860b);color:#1a1200}

/* START OVERLAY */
.start-overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#1a2744,#050810);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
.start-overlay.hidden{opacity:0;pointer-events:none}
.start-box{text-align:center;padding:20px;max-width:340px}
.start-emoji{font-size:80px;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(255,217,102,.6))}
.start-title{font-size:32px;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,#ffe9a0,#f0c040,#b8860b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;font-family:Georgia,serif}
.start-sub{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.5}
.start-btn{width:100%;background:linear-gradient(180deg,#2ecc71,#1a7d43);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:8px;box-shadow:0 4px 0 #0f3d22;transition:all .1s}
.start-btn.muted{background:linear-gradient(180deg,#576574,#2c3a52);box-shadow:0 4px 0 #1a2333;font-size:13px;padding:11px}
.start-btn:active{transform:translateY(3px);box-shadow:none}
</style>
</head>
<body>

<!-- START OVERLAY -->
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <div class="start-emoji">🏴‍☠️</div>
    <div class="start-title">LUCKY ROGER</div>
    <div class="start-sub" data-i18n="startSub">Пиратский слот с сокровищами</div>
    <button class="start-btn" id="startSound">🔊 <span data-i18n="startSound">Играть со звуком</span></button>
    <button class="start-btn muted" id="startMute"><span data-i18n="startMute">🔇 Без звука</span></button>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="uk">UKR</button>
      <button class="lang-btn" data-lang="ru">RUS</button>
      <button class="lang-btn" data-lang="en">ENG</button>
    </div>
    <button class="sound-btn" id="soundBtn">🔊</button>
  </div>

  <div class="title-box"><div class="title">LUCKY ROGER</div></div>

  <div class="balance-bar">
    <div class="stat"><span class="lbl" data-i18n="balance">Баланс</span><span class="val" id="balanceVal">1000 🪙</span></div>
    <div class="stat right win"><span class="lbl" data-i18n="win">Выигрыш</span><span class="val" id="winVal">0 🪙</span></div>
  </div>

  <div class="machine">
    <div class="reels-frame" id="reelsFrame">
      <div class="reels" id="reels"></div>
      <svg class="lines-overlay" id="linesOverlay"></svg>
    </div>
  </div>

  <div class="lines-row" id="linesRow">
    <button class="line-btn" data-lines="1">1</button>
    <button class="line-btn" data-lines="3">3</button>
    <button class="line-btn" data-lines="5">5</button>
    <button class="line-btn" data-lines="7">7</button>
    <button class="line-btn active" data-lines="9">9</button>
  </div>

  <div class="bet-bar">
    <button class="bet-btn" id="betMin">MIN</button>
    <button class="bet-btn" id="betDec">−</button>
    <div class="bet-mid">
      <div class="lbl" data-i18n="betPerLine">Ставка / линия</div>
      <div class="val" id="betVal">1 🪙</div>
    </div>
    <button class="bet-btn" id="betInc">+</button>
    <button class="bet-btn" id="betMax">MAX</button>
  </div>
  <div class="bet-total"><span data-i18n="totalBet">Всего</span>: <b id="totalBetVal">9</b> 🪙</div>

  <button class="spin-btn" id="spinBtn" data-i18n="spin">КРУТИТЬ</button>

  <div class="actions">
    <button class="act-btn gold" id="bonusBtn"><span class="ico">🎁</span><span data-i18n="dailyBonus">Бонус</span></button>
    <button class="act-btn green" id="riskBtn"><span class="ico">🃏</span><span data-i18n="risk">Риск</span></button>
    <button class="act-btn blue" id="shopBtn"><span class="ico">⭐</span><span data-i18n="shop">Магазин</span></button>
    <button class="act-btn" id="paytableBtn"><span class="ico">📋</span><span data-i18n="paytable">Выплаты</span></button>
  </div>
</div>

<!-- PAYTABLE MODAL -->
<div class="modal" id="paytableModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="paytableTitle">📋 ТАБЛИЦА ВЫПЛАТ</div>
    <div class="modal-text" data-i18n="paytableHint">Выплаты указаны за 1 монету ставки на линию</div>
    <table class="pt-table">
      <thead><tr><th></th><th>×3</th><th>×4</th><th>×5</th></tr></thead>
      <tbody id="ptBody"></tbody>
    </table>
    <button class="modal-close" onclick="closeModal('paytableModal')" data-i18n="close">Закрыть</button>
  </div>
</div>

<!-- SHOP MODAL -->
<div class="modal" id="shopModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="shopTitle">⭐ МАГАЗИН МОНЕТ</div>
    <div class="modal-text" data-i18n="shopHint">Покупка за Telegram Stars</div>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="modal-close" onclick="closeModal('shopModal')" data-i18n="close">Закрыть</button>
  </div>
</div>

<!-- BONUS MODAL -->
<div class="modal" id="bonusModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="bonusTitle">🏴‍☠️ ПИРАТСКИЙ КЛАД</div>
    <div class="modal-text" data-i18n="bonusText">Выберите сундук:</div>
    <div class="chests">
      <div class="chest" data-chest="0">📦</div>
      <div class="chest" data-chest="1">📦</div>
      <div class="chest" data-chest="2">📦</div>
    </div>
  </div>
</div>

<!-- RISK MODAL -->
<div class="modal" id="riskModal">
  <div class="modal-box">
    <div class="modal-title" data-i18n="riskTitle">🃏 РИСК-ИГРА</div>
    <div class="modal-text" id="riskText"></div>
    <div class="modal-btns">
      <button class="modal-btn green" id="riskHigher"></button>
      <button class="modal-btn red" id="riskLower"></button>
      <button class="modal-btn gray" id="riskTake"></button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
/* ============================================================
   🔧 КОНФИГ — ВАШ БОТ
   ============================================================ */
const CONFIG = {
  // Числовой ID вашего бота (узнать: @userinfobot или https://api.telegram.org/bot<TOKEN>/getMe)
  botId: '',

  // Username бота БЕЗ @ (для ссылок t.me/...)
  botUsername: '',  // например: 'LuckyRogerBot'

  // Endpoint для создания invoice (Cloudflare Function, см. ниже)
  invoiceEndpoint: '/api/invoice',

  // Пакеты для магазина
  packages: [
    { id: 'p100',   stars: 100,   coins: 1000,   name: 'Старт',      bonus: '' },
    { id: 'p500',   stars: 500,   coins: 6000,   name: 'Популярный', bonus: '+20%' },
    { id: 'p2000',  stars: 2000,  coins: 30000,  name: 'Клад',       bonus: '+50%', featured: true },
    { id: 'p10000', stars: 10000, coins: 200000, name: 'Легенда',    bonus: '+100%' }
  ]
};

/* ============================================================
   CONSTANTS

/* ============================================================
   AUDIO ENGINE (fixed)
   ============================================================ */
let ctx=null, musicGain=null, musicOn=false, musicStep=0, musicTimer=null, nextNoteTime=0;
const MUSIC_STEP=0.3;
const MUSIC_PATTERN=[
  {bass:110,lead:[440,659,880,659]},
  {bass:87, lead:[349,523,698,523]},
  {bass:131,lead:[523,659,784,659]},
  {bass:98, lead:[392,587,784,587]}
];

function initAudio(){
  if(ctx) return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=ctx.createGain();
    musicGain.gain.value=state.sound?0.14:0;
    musicGain.connect(ctx.destination);
  }catch(e){console.warn('Audio init failed',e)}
}

async function unlockAudio(){
  initAudio();
  if(!ctx) return false;
  if(ctx.state!=='running'){
    try{ await ctx.resume(); }catch(e){}
  }
  if(ctx.state==='running' && state.sound && !musicOn){
    startMusic();
  }
  return ctx.state==='running';
}

function playTone(freq,dur,type='sine',vol=0.15,when=0){
  if(!state.sound||!ctx||ctx.state!=='running') return;
  const t0=(when||ctx.currentTime);
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  osc.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playTick(progress){
  if(!state.sound||!ctx||ctx.state!=='running') return;
  playTone(900+Math.random()*400,0.025,'square',0.02+0.04*(1-progress));
}
function sfx(name){
  if(!state.sound||!ctx||ctx.state!=='running') return;
  switch(name){
    case 'click': playTone(800,0.05,'square',0.06); break;
    case 'spinStart':
      playTone(160,0.15,'sawtooth',0.12);
      playTone(220,0.15,'sawtooth',0.10,ctx.currentTime+0.06); break;
    case 'reelStop': playTone(180,0.09,'triangle',0.18); playTone(90,0.14,'sine',0.15,ctx.currentTime+0.03); break;
    case 'win': [523,659,784].forEach((f,i)=>playTone(f,0.18,'sine',0.16,ctx.currentTime+i*0.08)); break;
    case 'bigwin': [523,659,784,1047,1319,1568].forEach((f,i)=>playTone(f,0.22,'triangle',0.18,ctx.currentTime+i*0.09)); break;
    case 'lose': playTone(180,0.25,'sine',0.1); playTone(140,0.35,'sine',0.08,ctx.currentTime+0.15); break;
    case 'bonus': [784,988,1175,1568].forEach((f,i)=>playTone(f,0.2,'square',0.13,ctx.currentTime+i*0.09)); break;
    case 'chest': playTone(400,0.1,'square',0.12); playTone(800,0.1,'square',0.12,ctx.currentTime+0.08); playTone(1200,0.25,'triangle',0.15,ctx.currentTime+0.16); break;
    case 'coin': playTone(1568,0.06,'sine',0.14); playTone(2093,0.1,'sine',0.1,ctx.currentTime+0.05); break;
  }
}

function startMusic(){
  if(!ctx||!musicGain||musicOn||ctx.state!=='running') return;
  musicOn=true; musicStep=0; nextNoteTime=ctx.currentTime+0.1;
  musicGain.gain.setTargetAtTime(state.sound?0.14:0,ctx.currentTime,0.05);
  musicTick();
}
function stopMusic(){musicOn=false;if(musicTimer){clearTimeout(musicTimer);musicTimer=null}}
function musicTick(){
  if(!ctx||!musicOn||ctx.state!=='running') return;
  const lookahead=0.4;
  while(nextNoteTime<ctx.currentTime+lookahead){
    const barIdx=Math.floor(musicStep/4)%4;
    const beatInBar=musicStep%4;
    const bar=MUSIC_PATTERN[barIdx];
    if(beatInBar===0){
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type='sine'; osc.frequency.value=bar.bass;
      osc.connect(g); g.connect(musicGain);
      g.gain.setValueAtTime(0,nextNoteTime);
      g.gain.linearRampToValueAtTime(0.55,nextNoteTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.01,nextNoteTime+0.5);
      osc.start(nextNoteTime); osc.stop(nextNoteTime+0.55);
    }
    const leadFreq=bar.lead[beatInBar];
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type='triangle'; osc.frequency.value=leadFreq;
    osc.connect(g); g.connect(musicGain);
    g.gain.setValueAtTime(0,nextNoteTime);
    g.gain.linearRampToValueAtTime(0.3,nextNoteTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.005,nextNoteTime+MUSIC_STEP*0.9);
    osc.start(nextNoteTime); osc.stop(nextNoteTime+MUSIC_STEP*0.95);
    const bufSize=Math.floor(ctx.sampleRate*0.03);
    const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*0.4;
    const src=ctx.createBufferSource(); src.buffer=buf;
    const hg=ctx.createGain(); hg.gain.value=0.12;
    src.connect(hg); hg.connect(musicGain);
    src.start(nextNoteTime);
    nextNoteTime+=MUSIC_STEP;
    musicStep=(musicStep+1)%16;
  }
  musicTimer=setTimeout(musicTick,80);
}
function setMusicVolume(v){if(musicGain&&ctx)musicGain.gain.setTargetAtTime(v,ctx.currentTime,0.1)}

  });
}

/* ============================================================
   REEL ANIMATION
   ============================================================ */
function animateReel(track,final3,idx){
  return new Promise(resolve=>{
    const filler=32;
    let html='';
    for(let i=0;i<filler;i++) html+=`<div class="cell">${randSym()}</div>`;
    final3.forEach(s=>html+=`<div class="cell">${s}</div>`);
    track.innerHTML=html;
    track.style.transition='none';
    track.style.transform='translateY(0px)';
    track.classList.add('spinning');
    const targetY=-(filler*CELL_H);
    const start=performance.now();
    const dur=1600+idx*380;
    let lastTickY=0;
    function frame(now){
      const t=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-t,5);
      const y=targetY*eased;
      track.style.transform=`translateY(${y}px)`;
      if(Math.abs(y-lastTickY)>=CELL_H){playTick(t); lastTickY=y}
      if(t<1){requestAnimationFrame(frame)}
      else{
        track.classList.remove('spinning');
        track.animate(
          [{transform:`translateY(${targetY}px)`},{transform:`translateY(${targetY+10}px)`},{transform:`translateY(${targetY}px)`}],
          {duration:200,easing:'ease-out'}
        );
        sfx('reelStop');
        setTimeout(resolve,200);
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ============================================================
   LOGIC
   ============================================================ */
function genGrid(){
  const g=[];
  for(let r=0;r<REELS;r++){
    const col=[];
    for(let row=0;row<ROWS;row++) col.push(randSym());
    g.push(col);
  }
  return g;
}
function calcWins(grid,perLine){
  const cells=new Set(), wins=[]; let total=0;
  // Only check ACTIVE lines
  PAYLINES.slice(0, state.lines).forEach((line,idx)=>{
    const syms=line.map(([r,row])=>grid[r][row]);
    const first=syms[0];
    let count=1;
    for(let i=1;i<REELS;i++){ if(syms[i]===first) count++; else break; }
    if(count>=3){
      const mult=PAYTABLE[first][count-3];
      if(mult>0){
        const win=mult*perLine;
        total+=win;
        wins.push({idx,line,sym:first,count,mult,win});
        for(let i=0;i<count;i++) cells.add(`${line[i][0]},${line[i][1]}`);
      }
    }
  });
  return {total, cells, wins};
}

/* ============================================================
   WIN LINE DRAWING
   ============================================================ */
function drawWinLines(wins){
  overlay.innerHTML='';
  const fRect=frame.getBoundingClientRect();
  overlay.setAttribute('width',fRect.width);
  overlay.setAttribute('height',fRect.height);
  wins.forEach(w=>{
    const pts=[];
    for(let i=0;i<w.count;i++){
      const [r,row]=w.line[i];
      const cell=tracks[r].children[row];
      if(!cell) continue;
      const cr=cell.getBoundingClientRect();
      pts.push([cr.left+cr.width/2-fRect.left, cr.top+cr.height/2-fRect.top]);
    }
    if(pts.length<2) return;
    const color=LINE_COLORS[w.idx%LINE_COLORS.length];
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
    poly.setAttribute('stroke',color);
    poly.setAttribute('stroke-width','5');
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke-linecap','round');
    poly.setAttribute('stroke-linejoin','round');
    poly.style.filter=`drop-shadow(0 0 8px ${color}) drop-shadow(0 0 4px ${color})`;
    overlay.appendChild(poly);
    try{
      const len=poly.getTotalLength();
      poly.style.strokeDasharray=len;
      poly.style.strokeDashoffset=len;
      poly.getBoundingClientRect();
      requestAnimationFrame(()=>{poly.style.strokeDashoffset=0});
    }catch(e){}
  });
}

/* ============================================================
   SPIN
   ============================================================ */
async function spin(){
  if(isSpinning) return;
  await unlockAudio();
  const bet=totalBet();
  if(state.balance<bet){ notif(t('notEnough'),'error'); sfx('lose'); return; }
  isSpinning=true; clearLines();
  document.querySelectorAll('.cell.win').forEach(c=>c.classList.remove('win'));
  state.balance-=bet;
  $('winVal').textContent='0 🪙';
  save(); refresh();
  sfx('spinStart');
  const perLine=state.betPerLine;
  const finalGrid=genGrid();
  await Promise.all(tracks.map((tr,r)=>animateReel(tr,finalGrid[r],r)));
  setStatic(finalGrid);
  const {total,cells,wins}=calcWins(finalGrid,perLine);
  if(total>0){
    state.balance+=total;
    $('winVal').textContent='+'+fmt(total)+' 🪙';
    cells.forEach(key=>{
      const [r,row]=key.split(',').map(Number);
      const c=tracks[r].children[row];
      if(c) c.classList.add('win');
    });
    setTimeout(()=>drawWinLines(wins),150);
    const big=total>=bet*10;
    sfx(big?'bigwin':'win');
    notif(big?tF('bigWin',{n:fmt(total)}):tF('winMsg',{n:fmt(total)}),big?'gold':'');
    if(total>=bet*2) pendingRisk=total;
  }else{
    sfx('lose');
  }
  if(Math.random()<0.03) setTimeout(triggerBonus,500);
  isSpinning=false;
  save(); refresh();
}

    const res=await fetch(CONFIG.invoiceEndpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        packageId: pkg.id,
        stars: pkg.stars,
        coins: pkg.coins,
        userId: tg?.initDataUnsafe?.user?.id || 0,
        initData: tg?.initData || ''
      })
    });
    if(!res.ok) throw new Error('invoice failed');
    const { invoiceLink } = await res.json();
    if(!invoiceLink) throw new Error('no invoiceLink');

    if(tg?.openInvoice){
      tg.openInvoice(invoiceLink, (status)=>{
        if(status==='paid'){
          state.balance+=pkg.coins;
          save(); refresh(); sfx('coin');
          notif(tF('paySuccess',{n:fmt(pkg.coins)}),'gold');
          closeModal('shopModal');
        }
      });
    }else{
      window.open(invoiceLink,'_blank');
    }
  }catch(e){
    console.error('Invoice error:', e);
    notif(t('payError'),'error');
  }
}

/* ============================================================
   BONUS / RISK / DAILY
   ============================================================ */
function triggerBonus(){
  sfx('bonus');
  document.querySelectorAll('.chest').forEach(c=>{
    c.textContent='📦'; c.classList.remove('opened');
    c.onclick=()=>pickChest(c);
  });
  $('bonusModal').classList.add('active');
}
function pickChest(el){
  if(el.classList.contains('opened')) return;
  sfx('chest');
  const prizes=[50,100,200,300,500,1000];
  const prize=prizes[Math.floor(Math.random()*prizes.length)];
  el.textContent='💎'; el.classList.add('opened');
  state.balance+=prize; save(); refresh();
  notif(tF('bonusWon',{n:fmt(prize)}),'gold');
  document.querySelectorAll('.chest').forEach(c=>{
    if(c!==el && !c.classList.contains('opened')){ c.textContent='🕳️'; c.classList.add('opened'); }
  });
  setTimeout(()=>$('bonusModal').classList.remove('active'),1500);
}
function openRisk(){
  if(pendingRisk<=0){ notif(t('riskNoWin'),'error'); return; }
  $('riskText').textContent=tF('riskText',{n:fmt(pendingRisk)});
  $('riskModal').classList.add('active');
}
function riskChoose(win){
  const won=Math.random()<0.5 ? win : !win;
  $('riskModal').classList.remove('active');
  if(won){
    state.balance+=pendingRisk; sfx('win');
    notif(tF('riskWin',{n:fmt(pendingRisk)}),'gold');
  }else{
    state.balance-=pendingRisk; sfx('lose');
    notif(t('riskLose'),'error');
  }
  pendingRisk=0; save(); refresh();
}
function claimDaily(){
  const now=Date.now();
  if(now-state.lastDaily<24*3600*1000){ notif(t('dailyClaimed'),'error'); return; }
  state.lastDaily=now; state.balance+=100;
  save(); refresh(); sfx('bonus');
  notif(t('dailyGot'),'gold');
}

/* ============================================================
   EVENTS
   ============================================================ */
function bind(){
  // START OVERLAY
  $('startSound').onclick=async()=>{
    state.sound=true; save();
    await unlockAudio();
    $('startOverlay').classList.add('hidden');
    refresh();
  };
  $('startMute').onclick=()=>{
    state.sound=false; save();
    $('startOverlay').classList.add('hidden');
    refresh();
  };

  // LINES
  document.querySelectorAll('.line-btn').forEach(btn=>{
    btn.onclick=async()=>{
      if(isSpinning) return;
      state.lines=parseInt(btn.dataset.lines);
      await unlockAudio(); sfx('click');
      save(); refresh();
    };
  });

  // BET
  $('betMin').onclick=async()=>{ if(!isSpinning){state.betPerLine=1; await unlockAudio(); sfx('click'); save(); refresh()} };
  $('betMax').onclick=async()=>{ if(!isSpinning){state.betPerLine=100; await unlockAudio(); sfx('click'); save(); refresh()} };
  $('betDec').onclick=async()=>{ if(!isSpinning){state.betPerLine=Math.max(1,state.betPerLine-1); await unlockAudio(); sfx('click'); save(); refresh()} };
  $('betInc').onclick=async()=>{ if(!isSpinning){state.betPerLine=Math.min(100,state.betPerLine+1); await unlockAudio(); sfx('click'); save(); refresh()} };

  // SPIN
  $('spinBtn').onclick=()=>{ spin(); };

  // ACTIONS
  $('bonusBtn').onclick=async()=>{ await unlockAudio(); sfx('click'); claimDaily(); };
  $('riskBtn').onclick=async()=>{ await unlockAudio(); sfx('click'); openRisk(); };
  $('shopBtn').onclick=async()=>{ await unlockAudio(); sfx('click'); openShop(); };
  $('paytableBtn').onclick=async()=>{ await unlockAudio(); sfx('click'); openPaytable(); };

  // SOUND
  $('soundBtn').onclick=async()=>{
    state.sound=!state.sound;
    if(state.sound){
      await unlockAudio();
      setMusicVolume(0.14);
      startMusic();
      sfx('click');
      notif(t('soundOn'));
    }else{
      setMusicVolume(0);
      notif(t('soundOff'),'error');
    }
    save(); refresh();
  };

  // RISK
  $('riskHigher').onclick=async()=>{ await unlockAudio(); riskChoose(true); };
  $('riskLower').onclick=async()=>{ await unlockAudio(); riskChoose(false); };
  $('riskTake').onclick=()=>{ $('riskModal').classList.remove('active'); pendingRisk=0; };

  // LANG
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.onclick=async()=>{
      state.lang=b.dataset.lang; save(); applyI18n();
      await unlockAudio(); sfx('click'); notif(t('langChanged'));
    };
  });

  // CLOSE MODALS BY BACKDROP
  document.querySelectorAll('.modal').forEach(m=>{
    m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('active'); });
  });

  // RESIZE
  window.addEventListener('resize',()=>{ if(overlay.innerHTML) clearLines(); });

  // TAB VISIBILITY: pause music when hidden, resume when visible
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ stopMusic(); }
    else if(state.sound && ctx && ctx.state==='running'){ startMusic(); }
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  load();
  const tg=window.Telegram?.WebApp;
  if(tg){
    const code=tg.initDataUnsafe?.user?.language_code;
    if(code) state.lang=code.startsWith('uk')?'uk':code.startsWith('ru')?'ru':'en';
    tg.ready(); tg.expand();
    tg.setHeaderColor?.('#0a0e17'); tg.setBackgroundColor?.('#0a0e17');
  }
  buildReels(); bind(); applyI18n();
}
init();
</script>
