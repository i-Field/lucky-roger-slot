<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Roger - Pirate Slot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121620;
            --panel-bg: #1e2636;
            --gold: #f39c12;
            --gold-light: #f1c40f;
            --accent: #e74c3c;
            --text-main: #ffffff;
            --text-muted: #95a5a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Верхняя панель */
        .header-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .balance-box, .bet-box {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .value {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold-light);
        }

        /* Игровое поле / Барабаны */
        .slot-machine {
            background: #0d1117;
            border: 4px solid #34495e;
            border-radius: 16px;
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 8px 16px rgba(0,0,0,0.4);
            position: relative;
        }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: #161b22;
            padding: 8px;
            border-radius: 10px;
        }

        .reel {
            background: #ffffff;
            border-radius: 8px;
            height: 220px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .symbols-track {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease-out;
        }

        .symbol {
            height: 73px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        /* Панель управления */
        .controls-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid #2c3e50;
        }

        .bet-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-small {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-small:active {
            transform: scale(0.95);
        }

        .btn-spin {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 #962d22, 0 8px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-spin:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #962d22, 0 4px 8px rgba(0,0,0,0.4);
        }

        .btn-spin:disabled {
            background: #7f8c8d;
            box-shadow: 0 6px 0 #596566;
            cursor: not-allowed;
        }

        /* Нижний ряд кнопок */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-action {
            background: #2980b9;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-stars {
            background: linear-gradient(135deg, #f39c12, #d35400);
            grid-column: span 2;
        }

        /* Модальные окна / Мини-игры */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 3px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-size: 22px;
            color: var(--gold-light);
            margin-bottom: 10px;
            font-weight: 900;
        }

        .modal-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Сундуки бонус игры */
        .chests-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .chest {
            background: #2c3e50;
            border: 2px solid var(--gold);
            border-radius: 10px;
            font-size: 36px;
            padding: 15px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chest:active {
            transform: scale(0.9);
        }

        /* Уведомления */
        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            z-index: 200;
        }

        #notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="notification">Уведомление</div>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header-panel">
            <div class="balance-box">
                <span class="label">Баланс</span>
                <span class="value" id="balanceDisplay">1000 🪙</span>
            </div>
            <div class="bet-box" style="align-items: flex-end;">
                <span class="label">Выигрыш</span>
                <span class="value" id="winDisplay">0 🪙</span>
            </div>
        </div>

        <!-- Слот машина -->
        <div class="slot-machine">
            <div class="reels-grid" id="reelsGrid">
                <!-- Барабаны генерируются скриптом -->
            </div>
        </div>

        <!-- Управление -->
        <div class="controls-panel">
            <div class="bet-controls">
                <button class="btn-small" onclick="changeBet(-5)">MIN</button>
                <button class="btn-small" onclick="changeBet(-1)">-</button>
                <div style="text-align: center;">
                    <span class="label">Ставка на линию</span>
                    <span id="betDisplay" style="font-size: 16px; font-weight: bold; color: white;">9 🪙</span>
                </div>
                <button class="btn-small" onclick="changeBet(1)">+</button>
                <button class="btn-small" onclick="changeBet(5)">MAX</button>
            </div>

            <button class="btn-spin" id="spinButton" onclick="startSpin()">КРУТИТЬ</button>

            <div class="action-row">
                <button class="btn-action" onclick="claimDailyBonus()">🎁 Бонус</button>
                <button class="btn-action" onclick="toggleAudio()" id="soundBtn">🔊 Звук</button>
                <button class="btn-action btn-stars" onclick="buyStars()">⭐ Купить фишки за Stars</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно бонус игры (Сундуки) -->
    <div class="modal-overlay" id="bonusModal">
        <div class="modal-content">
            <div class="modal-title">🏴‍☠️ ПИРАТСКИЙ КЛАД!</div>
            <div class="modal-text">Вы нашли тайник с сокровищами! Выберите один из сундуков, чтобы забрать награду:</div>
            <div class="chests-grid">
                <div class="chest" onclick="pickChest(this)">📦</div>
                <div class="chest" onclick="pickChest(this)">📦</div>
                <div class="chest" onclick="pickChest(this)">📦</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно риск-игры -->
    <div class="modal-overlay" id="riskModal">
        <div class="modal-content">
            <div class="modal-title">🃏 РИСК-ИГРА</div>
            <div class="modal-text" id="riskText">Угадайте, карта дилера старше или младше? Удвойте свой выигрыш!</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-small" style="background:#27ae60; padding: 12px 20px;" onclick="chooseRisk('high')">МАСТЕР / ВЫШЕ</button>
                <button class="btn-small" style="background:#c0392b; padding: 12px 20px;" onclick="chooseRisk('low')">НИЖЕ</button>
            </div>
            <button class="btn-small" style="background:#7f8c8d; margin-top: 10px; width: 100%;" onclick="closeRiskModal()">Забрать выигрыш</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Игровая экономика и состояние
        let balance = 1000;
        let currentBet = 9; // По 1 монете на 9 линий
        let lastWin = 0;
        let isSpinning = false;
        let soundEnabled = true;
        let pendingRiskWin = 0;

        // Набор символов слота (эмодзи)
        const symbols = ['🪙', '⚓', '🗡️', '🗺️', '💣', '🦜', '🏴‍☠️'];
        // Веса символов для барабанов
        const reelSymbolsCount = 15;
        const numReels = 5;
        const numRows = 3;

        // Аудио движок на Web Audio API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'bonus') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(750, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 Звук' : '🔇 Звук OFF';
            showNotification(soundEnabled ? 'Звук включен' : 'Звук выключен');
        }

        // Инициализация барабанов в DOM
        const reelsGrid = document.getElementById('reelsGrid');
        let reelElements = [];

        function createReels() {
            reelsGrid.innerHTML = '';
            reelElements = [];
            for (let i = 0; i < numReels; i++) {
                const reelDiv = document.createElement('div');
                reelDiv.className = 'reel';
                const trackDiv = document.createElement('div');
                trackDiv.className = 'symbols-track';
                
                // Наполняем начальными символами
                let html = '';
                for (let j = 0; j < reelSymbolsCount; j++) {
                    html += `<div class="symbol">${getRandomSymbol()}</div>`;
                }
                trackDiv.innerHTML = html;
                reelDiv.appendChild(trackDiv);
                reelsGrid.appendChild(reelDiv);
                reelElements.push(trackDiv);
            }
        }

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        // Управление ставкой
        function changeBet(delta) {
            if (isSpinning) return;
            currentBet += delta;
            if (currentBet < 9) currentBet = 9;
            if (currentBet > 90) currentBet = 90;
            document.getElementById('betDisplay').innerText = currentBet + ' 🪙';
        }

        // Запуск вращения
        function startSpin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                showNotification('Недостаточно монет! Пополните баланс.');
                return;
            }

            balance -= currentBet;
            updateDisplay();
            isSpinning = true;
            document.getElementById('spinButton').disabled = true;
            document.getElementById('winDisplay').innerText = '0 🪙';

            let activeReels = numReels;

            reelElements.forEach((track, index) => {
                // Генерируем случайный победный набор для этого барабана
                let newSymbols = [];
                for(let k=0; k < 12; k++) {
                    newSymbols.push(getRandomSymbol());
                }
                
                // Финальные 3 символа ряда
                const finalResult = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
                newSymbols.push(finalResult[0], finalResult[1], finalResult[2]);

                let html = '';
                newSymbols.forEach(sym => {
                    html += `<div class="symbol">${sym}</div>`;
                });
                track.innerHTML = html;

                // Крутим с задержкой для каждого барабана
                const targetOffset = -(newSymbols.length - 3) * 73;
                track.style.transition = `transform ${0.6 + index * 0.2}s cubic-bezier(0.15, 0.85, 0.35, 1.2)`;
                track.style.transform = `translateY(${targetOffset}px)`;

                setTimeout(() => {
                    playSound('spin');
                    activeReels--;
                    if (activeReels === 0) {
                        checkWin();
                    }
                }, 600 + index * 200);
            });
        }

        // Проверка выигрыша
        function checkWin() {
            isSpinning = false;
            document.getElementById('spinButton').disabled = false;

            // Простая имитация выигрыша для динамики (RTP ~92%)
            let winMultiplier = 0;
            const rand = Math.random();

            if (rand < 0.35) {
                winMultiplier = Math.random() < 0.5 ? 1 : 2;
            } else if (rand < 0.42) {
                winMultiplier = 5;
            } else if (rand === 0.45) {
                // Триггер бонус игры (Сундуки)
                triggerBonusGame();
                return;
            }

            lastWin = currentBet * winMultiplier;

            if (lastWin > 0) {
                balance += lastWin;
                document.getElementById('winDisplay').innerText = lastWin + ' 🪙';
                playSound('win');
                showNotification(`Выигрыш: ${lastWin} монет!`);
                
                // Предложить риск игру при хорошем выигрыше
                if (lastWin >= currentBet * 2) {
                    setTimeout(() => openRiskModal(lastWin), 800);
                }
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('balanceDisplay').innerText = balance + ' 🪙';
        }

        // Ежедневный бонус
        function claimDailyBonus() {
            const lastClaim = localStorage.getItem('lucky_roger_last_claim');
            const now = new Date().getTime();

            if (lastClaim && now - lastClaim < 24 * 60 * 60 * 1000) {
                showNotification('Бонус уже получен! Ждите 24 часа.');
                return;
            }

            balance += 100;
            localStorage.setItem('lucky_roger_last_claim', now);
            updateDisplay();
            playSound('bonus');
            showNotification('🎁 +100 монет получено!');
        }

        // Бонус игра: Сундуки
        function triggerBonusGame() {
            playSound('bonus');
            document.getElementById('bonusModal').classList.add('active');
        }

        function pickChest(element) {
            const prizes = [50, 100, 250, 500];
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            element.innerHTML = '💎';
            balance += prize;
            updateDisplay();
            playSound('win');
            showNotification(`Сундук принес ${prize} монет!`);
            
            setTimeout(() => {
                document.getElementById('bonusModal').classList.remove('active');
                element.innerHTML = '📦'; // сброс
            }, 1200);
        }

        // Риск игра
        function openRiskModal(winAmount) {
            pendingRiskWin = winAmount;
            document.getElementById('riskText').innerText = `Рискнуть выигрышем ${winAmount} 🪙? Угадайте карту дилера!`;
            document.getElementById('riskModal').classList.add('active');
        }

        function chooseRisk(choice) {
            const won = Math.random() < 0.5;
            document.getElementById('riskModal').classList.remove('active');

            if (won) {
                pendingRiskWin *= 2;
                balance += pendingRiskWin;
                playSound('win');
                showNotification(`🎉 Победа в риске! Выигрыш удвоен: ${pendingRiskWin}`);
            } else {
                balance -= pendingRiskWin;
                showNotification('❌ Дилер победил. Вы потеряли выигрыш.');
            }
            updateDisplay();
        }

        function closeRiskModal() {
            document.getElementById('riskModal').classList.remove('active');
        }

        // Покупка фишек за Telegram Stars
        function buyStars() {
            if (tg.openInvoice) {
                // Интеграция со счетами Telegram Stars (XTR)
                showNotification('Открытие счета Telegram Stars...');
                // Здесь вызывается invoice бэкенда, заглушка для теста:
                setTimeout(() => {
                    balance += 500;
                    updateDisplay();
                    showNotification('⭐ Успешно куплено +500 монет!');
                }, 1000);
            } else {
                // Тестовый режим в браузере
                balance += 500;
                updateDisplay();
                showNotification('⭐ Тестовая покупка: +500 монет зачислено!');
            }
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 2500);
        }

        // Первый запуск генерации барабанов
        createReels();
        updateDisplay();
    </script>
</body>
</html>
